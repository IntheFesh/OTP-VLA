# =============================================================================
# Mini E2E test config: Path B baseline (det head + CFM decoder)
# Serves as PARALLEL BASELINE for criterion 5 (sample quality comparison).
# Inherits otp_soft_pathB_seed42 (deterministic head, lr=1e-4).
# Expected wall clock: ~30 min on RTX PRO 6000.
# =============================================================================

defaults:
  - otp_soft_pathB_seed42
  - _self_

train:
  num_epochs: 2
  ckpt_every: 100
  log_every: 10
  warmup_steps: 50

output_dir: results/minie2e_pathB_${now:%Y%m%d_%H%M%S}

wandb:
  enabled: false
  run_name: minie2e_pathB
