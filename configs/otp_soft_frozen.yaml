# =============================================================================
# OTP-Soft training configuration — frozen backbone
#
# The VLA backbone (OpenVLA-OFT) is fully frozen.  Only the OTP head, the
# language-agnostic decoder, and the geometry encoder receive gradient.
# Use this profile for fast experimentation and the §IV ablation column
# "frozen backbone".
#
# Minimal required overrides when launching with real data:
#   data.root=<path/to/object_poses>
#   data.grasp_affordance_dir=<path/to/grasp_affordances>
#
# Synthetic (no real data) quick sanity run:
#   synthetic_data=true train.num_steps=100 train.batch_size=4
# =============================================================================

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
# Top-level seed controls all RNG sources: torch global, cuda, numpy, random,
# DataLoader generator, and DataLoader worker_init_fn. Required field —
# train script will raise if missing. Override on CLI via `seed=42`.
seed: 0

# ---------------------------------------------------------------------------
# Synthetic-data shortcut
# ---------------------------------------------------------------------------
synthetic_data: false          # true → skip real DataLoader, use random tensors
synthetic_steps: 500           # how many synthetic batches per "epoch"

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  type: otp_soft
  backbone_mode: frozen           # one of: stub, frozen, lora, full
  backbone_dim: 4096              # OpenVLA-OFT hidden width

  otp_head:
    hidden_dim: 1024
    num_objects: 5
    horizon: 8
    num_heads: 8
    num_layers: 4
    vel_hidden_dim: 1024
    vel_num_layers: 3
    use_shortcut: true
    num_shortcut_levels: 4
    consistency_weight: 1.0
    num_sample_steps: 16

  decoder:
    trajectory_dim: 6
    affordance_dim: 7
    proprio_dim: 8
    hidden_dim: 512
    num_decoder_layers: 4
    num_heads: 8
    num_grasps_per_object: 8
    action_dim: 7
    use_flow_matching: true
    consistency_weight: 1.0
    num_sample_steps: 8

  geometry_encoder:
    num_points: 256
    output_dim: 64
    hidden_dim: 128

  otp_head_loss_weight: 1.0
  decoder_loss_weight: 1.0

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  precision: bf16                 # all computation in bfloat16 (paper §IV)
  optimizer: adamw
  lr: 1.0e-3                      # higher than 'lora' since fewer params train
  weight_decay: 1.0e-4
  warmup_steps: 500
  lr_schedule: cosine
  batch_size: 16
  num_epochs: 50
  num_steps: null                 # if set, stop after this many optimizer steps
  grad_clip: 1.0
  gradient_checkpointing: false

  # Logging cadence (§2.4 — CSV every ≤50 steps)
  log_every: 25
  ckpt_every: 1000
  eval_every: 2500

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  suite: libero_spatial
  root: data/object_poses                    # override on CLI
  grasp_affordance_dir: data/grasp_affordances  # override on CLI
  view_keys: [agentview_rgb, eye_in_hand_rgb]
  normalizer_path: data/object_poses/meta/stats_qpace.json
  num_workers: 4
  # Per-task demo split (leakage-free held-out evaluation).
  # Mutually exclusive: set exactly one (or neither for full-data training).
  #   train_end_demo: 45    -> demos[0:45] per task (training set)
  #   eval_start_demo: 45   -> demos[45:] per task (held-out set)
  train_end_demo: null
  eval_start_demo: null

# ---------------------------------------------------------------------------
# Output / checkpoints
# ---------------------------------------------------------------------------
output_dir: results/otp_soft_frozen

# ---------------------------------------------------------------------------
# Weights & Biases (optional)
# ---------------------------------------------------------------------------
wandb:
  enabled: false
  project: otp-vla
  entity: null                    # set to your W&B username/team
  run_name: null                  # auto-generated if null
