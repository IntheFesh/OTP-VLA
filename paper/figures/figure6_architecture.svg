<?xml version="1.0" encoding="UTF-8"?>
<!--
Figure 6: OTP-Soft architecture diagram
Shows: inputs → backbone (frozen) → head h_ψ → C3 boundary → decoder φ_θ → 7-DoF action
With C3 architectural boundary explicitly drawn as vertical dashed line.
Style: Black/white print-friendly, shaded boxes for frozen vs trainable modules.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480"
     font-family="Helvetica, Arial, sans-serif" font-size="12">

  <!-- ===== INPUTS column (left) ===== -->
  <g transform="translate(20, 40)">
    <text x="80" y="0" text-anchor="middle" font-weight="bold" font-size="13">Inputs</text>

    <!-- Image input -->
    <rect x="0" y="20" width="160" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="80" y="40" text-anchor="middle">Multi-view images</text>
    <text x="80" y="54" text-anchor="middle" font-size="10" font-style="italic">SigLIP + DINOv2 input</text>

    <!-- Instruction input -->
    <rect x="0" y="80" width="160" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="80" y="100" text-anchor="middle">Instruction ℓ</text>
    <text x="80" y="114" text-anchor="middle" font-size="10" font-style="italic">tokenized prompt</text>

    <!-- Proprioception -->
    <rect x="0" y="140" width="160" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="80" y="158" text-anchor="middle">Proprio (8D)</text>
    <text x="80" y="172" text-anchor="middle" font-size="10" font-style="italic">pos+quat+gripper=0</text>

    <!-- Object meshes -->
    <rect x="0" y="200" width="160" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="80" y="218" text-anchor="middle">Object meshes</text>
    <text x="80" y="232" text-anchor="middle" font-size="10" font-style="italic">pose-invariant geom.</text>

    <!-- Grasp affordance -->
    <rect x="0" y="260" width="160" height="40" fill="none" stroke="black" stroke-width="1.2"/>
    <text x="80" y="278" text-anchor="middle">Grasp affordance</text>
    <text x="80" y="292" text-anchor="middle" font-size="10" font-style="italic">per-object map</text>
  </g>

  <!-- ===== BACKBONE (frozen, shaded) ===== -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="180" height="200" fill="#e0e0e0" stroke="black" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-weight="bold">Backbone</text>
    <text x="90" y="38" text-anchor="middle" font-size="11" font-style="italic">(frozen, OpenVLA-OFT)</text>

    <line x1="20" y1="50" x2="160" y2="50" stroke="black" stroke-width="0.5"/>

    <text x="90" y="70" text-anchor="middle" font-size="11">SigLIP encoder</text>
    <text x="90" y="88" text-anchor="middle" font-size="11">DINOv2 encoder</text>
    <text x="90" y="106" text-anchor="middle" font-size="11">(fused to 6-ch)</text>

    <line x1="20" y1="120" x2="160" y2="120" stroke="black" stroke-width="0.5"/>

    <text x="90" y="138" text-anchor="middle" font-size="11">Projector</text>
    <text x="90" y="156" text-anchor="middle" font-size="11">LLaMA-2 trunk</text>

    <line x1="20" y1="170" x2="160" y2="170" stroke="black" stroke-width="0.5"/>

    <text x="90" y="188" text-anchor="middle" font-size="10" font-weight="bold">h_backbone</text>
  </g>

  <!-- Arrows from inputs to backbone -->
  <g stroke="black" stroke-width="1.2" fill="black">
    <line x1="180" y1="80" x2="218" y2="100"/>
    <polygon points="213,96 220,100 213,104"/>
    <line x1="180" y1="140" x2="218" y2="140"/>
    <polygon points="213,136 220,140 213,144"/>
    <line x1="180" y1="200" x2="218" y2="180"/>
    <polygon points="213,176 220,180 213,184"/>
  </g>

  <!-- ===== HEAD h_ψ (trainable) ===== -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="160" height="160" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="80" y="20" text-anchor="middle" font-weight="bold">Head h_ψ</text>
    <text x="80" y="36" text-anchor="middle" font-size="11" font-style="italic">(trainable)</text>

    <line x1="15" y1="50" x2="145" y2="50" stroke="black" stroke-width="0.5"/>

    <text x="80" y="70" text-anchor="middle" font-size="11">Shortcut Flow Matching</text>
    <text x="80" y="88" text-anchor="middle" font-size="11">+ Cocos source</text>

    <line x1="15" y1="100" x2="145" y2="100" stroke="black" stroke-width="0.5"/>

    <text x="80" y="118" text-anchor="middle" font-size="11">Output: z</text>
    <text x="80" y="134" text-anchor="middle" font-size="10">(8-step × N_obj × 7-DoF</text>
    <text x="80" y="148" text-anchor="middle" font-size="10">trajectory tensor)</text>
  </g>

  <!-- Arrow from backbone to head -->
  <g stroke="black" stroke-width="1.5" fill="black">
    <line x1="400" y1="240" x2="428" y2="140"/>
    <polygon points="423,138 430,140 425,146"/>
  </g>

  <!-- L_head loss arrow (above head) -->
  <g transform="translate(430, 30)">
    <text x="80" y="0" text-anchor="middle" font-size="10" font-style="italic">L_head: MSE on gt poses</text>
    <line x1="80" y1="3" x2="80" y2="28" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
    <polygon points="76,24 84,24 80,30" fill="black"/>
  </g>

  <!-- ===== C3 BOUNDARY (vertical dashed line, key visual element) ===== -->
  <g transform="translate(620, 50)">
    <line x1="0" y1="0" x2="0" y2="400" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="-3" y="-10" text-anchor="end" font-weight="bold" font-size="12">C3 boundary:</text>
    <text x="3" y="-10" text-anchor="start" font-weight="bold" font-size="12">ℓ ∉ inputs(φ_θ)</text>
    <text x="0" y="395" text-anchor="middle" font-size="10" font-style="italic">enforced via _check_forbidden</text>
  </g>

  <!-- ===== w(o) BUNDLE (between head and decoder) ===== -->
  <g transform="translate(650, 240)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="black" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="50" y="20" text-anchor="middle" font-weight="bold" font-size="11">w(o)</text>
    <text x="50" y="40" text-anchor="middle" font-size="10">proprio</text>
    <text x="50" y="56" text-anchor="middle" font-size="10">mesh prior</text>
    <text x="50" y="72" text-anchor="middle" font-size="10">grasp affordance</text>
    <text x="50" y="90" text-anchor="middle" font-size="10" font-style="italic">(not ℓ)</text>
  </g>

  <!-- Arrows from proprio/mesh/grasp inputs to w(o) bundle (passing below the C3 boundary) -->
  <g stroke="black" stroke-width="1" fill="black">
    <line x1="180" y1="200" x2="645" y2="270"/>
    <line x1="180" y1="260" x2="645" y2="290"/>
    <line x1="180" y1="320" x2="645" y2="310"/>
  </g>

  <!-- ===== DECODER φ_θ (trainable, right of C3 boundary) ===== -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="140" height="200" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="70" y="20" text-anchor="middle" font-weight="bold">Decoder φ_θ</text>
    <text x="70" y="36" text-anchor="middle" font-size="11" font-style="italic">(trainable)</text>

    <line x1="15" y1="50" x2="125" y2="50" stroke="black" stroke-width="0.5"/>

    <text x="70" y="70" text-anchor="middle" font-size="11">Inputs: (z, w(o))</text>
    <text x="70" y="88" text-anchor="middle" font-size="11">NO ℓ</text>

    <line x1="15" y1="100" x2="125" y2="100" stroke="black" stroke-width="0.5"/>

    <text x="70" y="118" text-anchor="middle" font-size="11">Shortcut Flow</text>
    <text x="70" y="134" text-anchor="middle" font-size="11">Matching decoder</text>

    <line x1="15" y1="150" x2="125" y2="150" stroke="black" stroke-width="0.5"/>

    <text x="70" y="170" text-anchor="middle" font-size="11">Output:</text>
    <text x="70" y="186" text-anchor="middle" font-size="11" font-weight="bold">7-DoF action chunk</text>
  </g>

  <!-- Arrow from head's z output to decoder (crossing C3 boundary) -->
  <g stroke="black" stroke-width="1.5" fill="black">
    <line x1="590" y1="180" x2="718" y2="180"/>
    <polygon points="713,176 720,180 713,184"/>
    <text x="654" y="172" text-anchor="middle" font-size="11" font-style="italic">z</text>
  </g>

  <!-- Arrow from w(o) bundle to decoder -->
  <g stroke="black" stroke-width="1" fill="black">
    <line x1="750" y1="240" x2="780" y2="220"/>
    <polygon points="775,218 783,220 776,226"/>
  </g>

  <!-- L_decoder loss arrow -->
  <g transform="translate(720, 320)">
    <text x="70" y="30" text-anchor="middle" font-size="10" font-style="italic">L_decoder: SFM on gt actions</text>
    <line x1="70" y1="0" x2="70" y2="25" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
    <polygon points="66,5 74,5 70,-2" fill="black"/>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(20, 410)">
    <text x="0" y="0" font-size="11" font-weight="bold">Legend:</text>
    <rect x="60" y="-12" width="20" height="14" fill="#e0e0e0" stroke="black"/>
    <text x="85" y="0" font-size="11">frozen</text>
    <rect x="135" y="-12" width="20" height="14" fill="none" stroke="black"/>
    <text x="160" y="0" font-size="11">trainable</text>
    <line x1="225" y1="-5" x2="245" y2="-5" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="250" y="0" font-size="11">C3 boundary</text>
    <line x1="335" y1="-5" x2="355" y2="-5" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="360" y="0" font-size="11">training loss flow</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <text x="440" y="465" text-anchor="middle" font-size="10" font-style="italic">
    OTP-Soft architecture. The C3 boundary structurally enforces ℓ ∉ inputs(φ_θ);
    all language information reaches the decoder only via z = h_ψ(o, ℓ).
  </text>

</svg>


