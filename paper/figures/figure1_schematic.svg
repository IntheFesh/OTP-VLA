<?xml version="1.0" encoding="UTF-8"?>
<!--
Figure 1: Three-layer signal-flow diagnostic schematic
Shows: Backbone → Demonstration Data → Policy Latent pipeline
With three measurement annotations: Gate 1 (r=+0.76), M3 (r=-0.27), C1 (r=-0.19)
Style: Black/white print-friendly, clean lines, two-column figure
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"
     font-family="Helvetica, Arial, sans-serif" font-size="13">

  <!-- Background (transparent) -->

  <!-- ===== Top row: input ℓ (instruction) ===== -->
  <g transform="translate(0, 30)">
    <text x="400" y="20" text-anchor="middle" font-weight="bold" font-size="14">
      Language instruction ℓ
    </text>
    <!-- Arrow down from ℓ to first box -->
    <line x1="400" y1="30" x2="400" y2="60" stroke="black" stroke-width="1.5"/>
    <polygon points="395,55 405,55 400,65" fill="black"/>
  </g>

  <!-- ===== Three pipeline stages (left to right) ===== -->

  <!-- Stage 1: Backbone -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="200" height="120" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" font-weight="bold">Backbone</text>
    <text x="100" y="50" text-anchor="middle" font-style="italic">h_backbone</text>
    <text x="100" y="80" text-anchor="middle" font-size="11">OpenVLA-OFT</text>
    <text x="100" y="98" text-anchor="middle" font-size="11">SigLIP+DINOv2+LLM</text>
    <text x="100" y="114" text-anchor="middle" font-size="10" font-style="italic">(pre-training, frozen)</text>
  </g>

  <!-- Stage 2: Demonstration data -->
  <g transform="translate(290, 110)">
    <rect x="0" y="0" width="200" height="120" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" font-weight="bold">Demonstration data</text>
    <text x="100" y="50" text-anchor="middle" font-style="italic">a ~ p_D(·| o, ℓ)</text>
    <text x="100" y="80" text-anchor="middle" font-size="11">LIBERO-Spatial</text>
    <text x="100" y="98" text-anchor="middle" font-size="11">teleop trajectories</text>
    <text x="100" y="114" text-anchor="middle" font-size="10" font-style="italic">(supervision signal)</text>
  </g>

  <!-- Stage 3: Policy latent -->
  <g transform="translate(550, 110)">
    <rect x="0" y="0" width="200" height="120" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" font-weight="bold">Policy latent</text>
    <text x="100" y="50" text-anchor="middle" font-style="italic">z = h_ψ(o, ℓ)</text>
    <text x="100" y="80" text-anchor="middle" font-size="11">OTP-Soft head</text>
    <text x="100" y="98" text-anchor="middle" font-size="11">after training</text>
    <text x="100" y="114" text-anchor="middle" font-size="10" font-style="italic">(post-training)</text>
  </g>

  <!-- ===== Connecting arrows between stages ===== -->
  <g stroke="black" stroke-width="1.5" fill="black">
    <!-- ℓ → Stage 1 -->
    <line x1="400" y1="95" x2="200" y2="125" stroke-dasharray="3,2"/>
    <!-- ℓ → Stage 2 -->
    <line x1="400" y1="95" x2="390" y2="125" stroke-dasharray="3,2"/>
    <!-- ℓ → Stage 3 -->
    <line x1="400" y1="95" x2="600" y2="125" stroke-dasharray="3,2"/>

    <!-- Stage 1 → Stage 2 (supervision flow) -->
    <line x1="230" y1="170" x2="285" y2="170" stroke-width="2"/>
    <polygon points="280,165 290,170 280,175"/>
    <!-- Stage 2 → Stage 3 (supervision flow) -->
    <line x1="490" y1="170" x2="545" y2="170" stroke-width="2"/>
    <polygon points="540,165 550,170 540,175"/>
  </g>

  <!-- ===== Mantel test annotations (below each stage box) ===== -->

  <!-- Gate 1 annotation -->
  <g transform="translate(30, 250)">
    <text x="100" y="15" text-anchor="middle" font-weight="bold" font-size="12">Gate 1</text>
    <text x="100" y="35" text-anchor="middle">r(h_backbone, ℓ) = </text>
    <text x="100" y="55" text-anchor="middle" font-weight="bold" font-size="16">+0.76</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" font-style="italic">p &lt; 0.001</text>
    <!-- Visual: strong correlation = thick filled bar -->
    <rect x="30" y="78" width="140" height="14" fill="black"/>
  </g>

  <!-- M3 annotation -->
  <g transform="translate(290, 250)">
    <text x="100" y="15" text-anchor="middle" font-weight="bold" font-size="12">M3</text>
    <text x="100" y="35" text-anchor="middle">r(demo traj, ℓ) = </text>
    <text x="100" y="55" text-anchor="middle" font-weight="bold" font-size="16">−0.27</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" font-style="italic">p = 0.96</text>
    <!-- Visual: near-null correlation = thin hatched bar -->
    <rect x="30" y="78" width="140" height="14" fill="none" stroke="black" stroke-width="1"/>
    <line x1="35" y1="78" x2="35" y2="92" stroke="black" stroke-width="0.5"/>
    <line x1="50" y1="78" x2="50" y2="92" stroke="black" stroke-width="0.5"/>
    <line x1="65" y1="78" x2="65" y2="92" stroke="black" stroke-width="0.5"/>
  </g>

  <!-- C1 annotation -->
  <g transform="translate(550, 250)">
    <text x="100" y="15" text-anchor="middle" font-weight="bold" font-size="12">C1</text>
    <text x="100" y="35" text-anchor="middle">r(z_policy, ℓ) = </text>
    <text x="100" y="55" text-anchor="middle" font-weight="bold" font-size="16">−0.19</text>
    <text x="100" y="72" text-anchor="middle" font-size="10" font-style="italic">p = 0.91</text>
    <!-- Visual: near-null correlation = thin hatched bar -->
    <rect x="30" y="78" width="140" height="14" fill="none" stroke="black" stroke-width="1"/>
    <line x1="35" y1="78" x2="35" y2="92" stroke="black" stroke-width="0.5"/>
    <line x1="50" y1="78" x2="50" y2="92" stroke="black" stroke-width="0.5"/>
    <line x1="65" y1="78" x2="65" y2="92" stroke="black" stroke-width="0.5"/>
  </g>

  <!-- ===== Summary label below ===== -->
  <g transform="translate(0, 340)">
    <text x="400" y="12" text-anchor="middle" font-size="11" font-style="italic">
      Language preserved at backbone (ρ² ≈ 0.58) → attenuated to near-null at demo (ρ² ≈ 0.07) → inherited by policy
    </text>
  </g>

</svg>


